name: Validate main security framework migration
on:
  push:
    branches: [security/2026-10-main-next15]
permissions:
  contents: write
jobs:
  migrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Resolve lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Apply compatible security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Verify tests
        run: npm test
      - name: Verify dynamic build
        run: npm run build
      - name: Verify GitHub Pages build
        run: |
          npm run pages:build
          test -f out/index.html
      - name: Commit verified lockfile to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: regenerate audited lockfile on main [skip ci]"
            git push origin HEAD:security/2026-10-main-next15
          fi
      - name: Audit residual security risks
        run: npm audit --audit-level=high --omit=dev
