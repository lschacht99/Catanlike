name: Island Duel API security
on:
  pull_request:
    paths: ['island-duel/supabase/**', '.github/workflows/island-duel-security.yml']
  push:
    branches: [Assetversion]
    paths: ['island-duel/supabase/**', '.github/workflows/island-duel-security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test island-duel/supabase/security.test.mjs
