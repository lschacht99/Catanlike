name: Island Duel API security
on:
  pull_request:
    paths: ['island-duel/supabase/**', '.github/workflows/island-duel-security.yml']
  push:
    branches: [Assetversion]
    paths: ['island-duel/supabase/**', '.github/workflows/island-duel-security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test island-duel/supabase/security.test.mjs
