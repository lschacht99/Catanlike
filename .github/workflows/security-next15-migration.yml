name: Validate security framework migration
on:
  push:
    branches:
      - security/2026-10-next15-migration
permissions:
  contents: write
jobs:
  install-test-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Generate refreshed lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact resolved dependencies
        run: npm ci --no-fund
      - name: Run unit tests
        run: npm test
      - name: Verify Next.js application build
        run: npm run build
      - name: Security audit, high and critical
        run: npm audit --audit-level=high --omit=dev
      - name: Persist validated dependency lockfile to migration branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: regenerate lockfile for Next.js 15 patched release [skip ci]"
            git push origin HEAD:security/2026-10-next15-migration
          fi
